<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WeakC4 — Connect 4</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header>
      <h1>WeakC4 — Connect 4</h1>
      <div id="var-name">Very Beginning</div>
    </header>

    <div id="status-row">
      <div id="turn-row">
        <div class="pip red" id="pip"></div>
        <span id="turn-text">Your turn — Red</span>
      </div>
      <div id="badge" class="badge in-book">In Book</div>
    </div>

    <div id="board-outer">
      <div id="board"></div>
    </div>

    <div id="col-nums"></div>

    <div id="msg"></div>

    <div id="btns">
      <button id="btn-new">New Game</button>
      <button id="btn-hint">Flash Hint</button>
    </div>
  </div><!-- #app -->

  <script src="game.js"></script>
</body>
</html>
